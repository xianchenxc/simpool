name: Release

# Every push to main updates the Release PR (version bump + CHANGELOG from
# conventional commits). Merging that PR tags the release, creates the GitHub
# Release and publishes to npm in the same run: tags pushed with GITHUB_TOKEN
# would not trigger a separate workflow.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
      # npm Trusted Publishing: the job proves its identity to npm over OIDC, no token needed.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm ci
      # prepublishOnly runs typecheck, tests and build first.
      - run: npm publish
